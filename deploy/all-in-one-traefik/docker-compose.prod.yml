services:
  openmu-startup:
    build:
      context: ${OPENMU_ROOT:-../..}
      dockerfile: "Dockerfile - Copia.openmu"
    image: munique/openmu:latest
    container_name: openmu-startup
    networks:
      - proxy
    ports:
      - "55901:55901"
      - "55902:55902"
      - "55903:55903"
      - "55904:55904"
      - "55905:55905"
      - "55906:55906"
      - "44405:44405"
      - "44406:44406"
      - "55980:55980"
    environment:
      DB_HOST: database
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=openmu;Username=postgres;Password=postgres
      RESOLVE_IP: 127.0.0.1
    working_dir: /app/
    command: ["-autostart"]
    volumes:
      - ./.htpasswd:/etc/nginx/.htpasswd
    depends_on:
      database:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.openmu.entrypoints=websecure"
      - "traefik.http.routers.openmu.rule=Host(`${DOMAIN}`)"
      - "traefik.http.services.openmu.loadbalancer.server.port=8080"
      - "traefik.http.routers.openmu.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.usersfile=.htpasswd"

  database:
    image: postgres:15
    container_name: database
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openmu
      POSTGRES_USER: postgres
    networks:
      - proxy
    ports:
      - "5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: website
    networks:
      - proxy
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: openmu
      DB_USER: postgres
      DB_PASSWORD: postgres
      FLASK_DEBUG: "false"
      FLASK_SECRET_KEY: "change-me-in-production"
      OPENMU_API_URL: "http://openmu-startup:8080"
    depends_on:
      database:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.website.entrypoints=websecure"
      - "traefik.http.routers.website.rule=Host(`${WEBSITE_DOMAIN:-muonline.com.br}`)"
      - "traefik.http.services.website.loadbalancer.server.port=5000"
    restart: unless-stopped

  traefik:
    image: traefik
    container_name: traefik
    restart: always
    command:
      - "--log.level=INFO"
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=isaias.pereira0003@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/acme.json"
    security_opt:
      - no-new-privileges:true
    ports:
      - 80:80
      - 443:443
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data-traefik/traefik.yml:/traefik.yml:ro
      - ./data-traefik/acme.json:/acme.json
      - ./data-traefik/configurations:/configurations
      - "./.htpasswd:/.htpasswd"
    networks:
      - proxy
    labels:
      - "traefik.docker.network=proxy"

networks:
  proxy:
    external: true

volumes:
  dbdata:
