services:
  openmu:
    build:
      context: ../..
      dockerfile: Dockerfile.openmu
    image: munique/openmu:latest
    container_name: openmu
    networks:
      - proxy
    ports:
      - "55901:55901"
      - "55902:55902"
      - "55903:55903"
      - "55904:55904"
      - "55905:55905"
      - "55906:55906"
      - "44405:44405"
      - "44406:44406"
      - "55980:55980"
    environment:
      DB_HOST: database
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=openmu;Username=postgres;Password=postgres
      RESOLVE_IP: 127.0.0.1
    working_dir: /app/
    volumes:
      - ./.htpasswd:/etc/nginx/.htpasswd
    depends_on:
      database:
        condition: service_healthy  # ← Aguarda o banco estar pronto
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.openmu.entrypoints=web"
      - "traefik.http.routers.openmu.rule=Host(`admin.docker.localhost`)"
      - "traefik.http.services.openmu.loadbalancer.server.port=8080"
      - "traefik.http.routers.openmu.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.usersfile=.htpasswd"

  database:
    image: postgres:15
    container_name: database
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openmu
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    networks:
      - proxy
    ports:
      - "5432:5432"

    volumes:
      - dbdata:/var/lib/postgresql/data #store data on volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: website
    networks:
      - proxy
    ports:
      - "8081:5000"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: openmu
      DB_USER: postgres
      DB_PASSWORD: postgres
      FLASK_DEBUG: "false"
    depends_on:
      database:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.website.entrypoints=web"
      - "traefik.http.routers.website.rule=Host(`muonline.com.br`)"
      - "traefik.http.services.website.loadbalancer.server.port=5000"
    restart: unless-stopped

  traefik:
    image: "traefik"
    container_name: "traefik"
    restart: always
    command:
      - "--log.level=INFO"
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
      - ./.htpasswd:/.htpasswd
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  dbdata:
